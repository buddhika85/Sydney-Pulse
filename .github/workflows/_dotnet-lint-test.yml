# Reusable workflow - .NET lint + .NET build + .NET test + Bicep validation + Bicep What-If Delta (optional).
# Called by - ci.yml (PR gate) and deploy-dev.yml (pre-deploy gate).
# When runWhatIf=true, additionally previews the Bicep delta vs live dev azure Resource Group.

# Appears in GitHub Actions UI
name: dotnet-lint-test

on:
  # when called by parent workflow file ci.yml OR deploy-dev.yml
  workflow_call:
    inputs:
      # which .NET solution to build
      solution:
        description: Path to the .NET solution
        type: string
        default: functions/SydneyPulse.sln

      # which Bicep file to validate
      bicepEntrypoint:
        description: Bicep entrypoint file
        type: string
        default: infra/main.bicep

      # where to find Bicep parameters
      bicepParams:
        description: Bicep parameter file (used by what-if only)
        type: string
        default: infra/parameters/dev.bicepparam

      # which Azure Resource Group to run what‑if against
      resourceGroup:
        description: Resource group for what-if preview
        type: string
        default: sydney-pulse-rg-dev

      # whether to run what‑if or not - defaults to false
      runWhatIf:
        description: Run Bicep what-if (requires Azure OIDC secrets)
        type: boolean
        default: false

    # secrets to use if what‑if is true
    # They are injected into the workflow at runtime, and read from
    # GitHub → Settings → Secrets and variables → Actions → Repository secrets
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

# id-token write is required by azure/login (OIDC). contents read covers checkout of .NET solution.
permissions:
  # write: allows OIDC token issuance for azure/login may run what‑if and log into Azure
  id-token: write
  # read: allows checkout of the repo
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # install .NET SDK required to build/test the .NET Solution
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Restores NuGet packages FIRST so downstream steps use --no-restore
      # and don't each trigger their own implicit restore. Retry loop hardens
      # against transient NuGet.org network flakes (~1-3% failure rate observed).
      - name: dotnet restore (with retry on transient NuGet flakes)
        run: |
          for i in 1 2 3; do
            dotnet restore ${{ inputs.solution }} && exit 0
            echo "restore attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::dotnet restore failed after 3 attempts"
          exit 1

      # Fail fast on whitespace/style before burning the build + tests.
      # --no-restore skips format's implicit restore (already done above).
      - name: dotnet format --verify-no-changes
        run: dotnet format ${{ inputs.solution }} --verify-no-changes --no-restore

      # Builds the solution in Release mode
      - name: dotnet build
        run: dotnet build ${{ inputs.solution }} --no-restore --configuration Release

      # TEST STEP 1 - Runs all Unit Tests and collects coverage (Coverlet, Cobertura XML) into a temp folder outside the repo
      # Do not build - we built already in previous step
      # Generates: /$RUNNER_TEMP/coverage/**/coverage.cobertura.xml  (** - the unique GUID for each test run given by Coverlet)
      # coverage.runsettings: These are Classes to be excluded when Coverlet calculates unit test coverage: (mostly generated code and code with no logic)
      - name: dotnet test
        run: >
          dotnet test ${{ inputs.solution }}
          --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings functions/coverage.runsettings
          --results-directory "${{ runner.temp }}/coverage"

      # TEST STEP 2 - Installs ReportGenerator (pinned version, free, no account) as a global tool
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12

      # TEST STEP 3 - Merges the Cobertura files into an HTML report and a markdown summary, in a temp folder outside the repo
      # Finds the coverage.cobertura.xml inside each GUID subfolder that previous step produced.
      # stores 2 unit test coverage reports to: /$RUNNER_TEMP/coverage-report/
      # 1 Html coverage report: gives the clickable report, and
      # 2 MarkdownSummaryGithub writes SummaryGithub.md, a table formatted for the GitHub run page
      - name: Generate coverage report
        run: >
          reportgenerator
          -reports:"${{ runner.temp }}/coverage/**/coverage.cobertura.xml"
          -targetdir:"${{ runner.temp }}/coverage-report"
          -reporttypes:"Html;MarkdownSummaryGithub"

      # TEST STEP 4 - Shows the coverage table on the workflow run page (no download needed)
      - name: Add coverage summary to run page
        run: cat "${{ runner.temp }}/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      # TEST STEP 5 - Keeps the clickable HTML report as a downloadable artifact
      # This zips the whole coverage-report folder, including index.html, and attaches it to the run.
      # We download it, unzip it and open index.html to click through files and see untested lines.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          retention-days: 7

      # Validates every Bicep module compiles cleanly before any deployments
      - name: az bicep build
        run: az bicep build --file ${{ inputs.bicepEntrypoint }}

      # OIDC login ONLY WHEN what-if = true — keeps PRs from forks (no OIDC) failing-safe.
      - name: Azure login (OIDC)
        if: ${{ inputs.runWhatIf }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Runs What-if on Bicep - shows Azure Infra changes and prevents accidental infra destruction
      - name: Bicep what-if (dev)
        if: ${{ inputs.runWhatIf }}
        run: |
          az deployment group what-if \
            --resource-group ${{ inputs.resourceGroup }} \
            --template-file ${{ inputs.bicepEntrypoint }} \
            --parameters ${{ inputs.bicepParams }}
