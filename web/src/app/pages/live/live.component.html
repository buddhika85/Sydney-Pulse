<!-- live.component.html - dashboard shell.
     Grid regions: header (row 1) | map + alerts (row 2, 2-col at ≥ 1024 px).
     - mapEl template ref is Leaflet's mount point, resolved in ngAfterViewInit
     - Freshness pill flips text + colour off the isStale() computed
     - "Sydney Trains" pill answers the demo question "where are the buses"
       before it gets asked (Phase 1 scope marker) -->
<div class="live-shell">
  <header class="live-header">
    <span class="live-scope-pill">Sydney Trains</span>

    <sp-filters-bar
      [routes]="routeOptions()"
      [selectedRoute]="selectedRoute()"
      (routeChange)="onRouteChange($event)"
    />

    <span
      class="live-freshness"
      [class.live-freshness--stale]="isStale()"
    >
      {{ isStale() ? 'Stale' : 'Live' }}
    </span>
  </header>

  <div #mapEl class="live-map"></div>

  <aside class="live-alerts">
    <sp-alerts-panel
      [alerts]="filteredAlerts()"
      [selectedRoute]="selectedRoute()"
    />
  </aside>
</div>
