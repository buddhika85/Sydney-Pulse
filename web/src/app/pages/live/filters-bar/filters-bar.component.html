<!-- filters-bar.component.html - route filter dropdown. Template ref #sel
     keeps the (change) handler typed against HTMLSelectElement, avoiding
     the $any($event.target) escape hatch. All-routes option value is ""
     and is normalised to null inside onSelect() before emit. -->
<label class="flex items-center gap-2 text-sm">
  <span class="text-gray-700">Route</span>
  <select
    #sel
    class="border border-gray-300 rounded px-2 py-1 bg-white"
    [value]="selectedRoute() ?? ''"
    (change)="onSelect(sel.value)"
  >
    <option value="">All routes</option>
    @for (route of routes(); track route) {
      <option [value]="route">{{ route }}</option>
    }
  </select>
</label>
